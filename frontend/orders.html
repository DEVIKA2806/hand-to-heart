<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Hand2Heart</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="navbar">
        <a href="index.html" class="logo">
            <span class="logo-dark">HAND to</span>
            <span class="logo-green">
                HEART
                <i class="fa-solid fa-hand-holding-heart"></i>
            </span>
        </a>
        <div class="nav-right">
            <div class="cart" onclick="window.location.href='cart.html'">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cart-count">0</span>
            </div>
            <div class="login" onclick="window.location.href='index.html'">
                <i class="fa-solid fa-home"></i>
            </div>
        </div>
    </div>

    <div class="orders-container">
        <a href="index.html" class="back-btn">← Back to Shop</a>
        <h1 class="page-title">My Order History</h1>
        
        <div id="ordersList">
            <p style="text-align:center;">Loading your orders...</p>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // On Page Load, fetch orders
        document.addEventListener('DOMContentLoaded', fetchOrderHistory);
    </script>
</body>
</html>
