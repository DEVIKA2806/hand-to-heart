<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Shopping Cart</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="shop.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="shop-body">
    <div class="navbar">
        <a href="index.html" class="logo">
            <span class="logo-dark">HAND to</span>
            <span class="logo-green">
                HEART
                <i class="fa-solid fa-hand-holding-heart"></i>
            </span>
        </a>
        <div class="nav-items">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li>|</li>
                <li><a href="#">Items</a></li>
                <li>|</li>
                <li><a href="about.html">About Us</a></li>
                <li>|</li>
                <li><a href="contact.html">Contact Us</a></li>
                <li>|</li>
                <li><a href="#">Featured</a></li>
            </ul>
        </div>
        <div id="guest-btn" class="login" onclick="openLogin()">
            <i class="fa-solid fa-user"></i>
        </div>
    </div>  
    
    <div class="cart-page-container">
        <h1 class="text-center mb-4">Your Shopping Cart</h1>
        <div id="cartItemsList">
            </div>

        <div id="cartEmptyMessage" class="text-center mt-5" style="display:none;">
            <p style="font-size: 1.5em; color: #6C757D;">Your cart is empty. Start shopping now!</p>
            <button class="btn btn-green" onclick="window.location.href='shop-now.html'">Go to Shop</button>
        </div>

        <div id="cartSummary">
            <div class="total-section">
                <span>Subtotal:</span> <span id="cartSubtotal">₹0.00</span>
            </div>
            <button class="btn-checkout" onclick="openCheckoutModal()">Proceed to Checkout</button>
        </div>
    </div>
    
    <div id="checkoutModal" class="login-modal">
        <div class="login-card">
            <div id="checkoutForm">
                </div>
        </div>
    </div>
    <script src="script.js"></script>
    <script>
        // Directly call the render function for the cart page on load
        document.addEventListener('DOMContentLoaded', () => {
             renderCartPage(); 
        });
    </script>
</body>
</html>
